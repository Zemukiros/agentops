# Planning and DAG validity. Fixture web search only covers pgvector, "widget pro injection"
# and "quarterly report"; the demo SQL database has customers / products / orders.
- id: plan-simple-summary
  category: planning
  title: One-step request gets a small, valid plan
  request: Write a 120-word summary of what pgvector is, for a product manager.
  expected_subtasks: 1
  cassette: true
  checks:
    - {name: status_in, args: {statuses: [completed]}}
    - {name: plan_size, args: {min: 1, max: 2}}
    - {name: plan_valid_first_try}
    - {name: bounded}
  rubric:
    - Explains that pgvector adds vector storage and similarity search to PostgreSQL.
    - Is roughly 120 words (between 80 and 170 words).
    - Is understandable by a non-specialist product manager (no unexplained jargon).

- id: plan-research-then-write
  category: planning
  title: Research feeds writing through a dependency
  request: Research how pgvector compares with dedicated vector databases, then write a one-page recommendation for our team.
  expected_subtasks: 2
  cassette: true
  checks:
    - {name: status_in, args: {statuses: [completed]}}
    - {name: plan_has_specialists, args: {specialists: [research, writing]}}
    - {name: plan_has_dependency}
    - {name: tool_used, args: {tool: web_search}}
    - {name: bounded}
  rubric:
    - States a clear recommendation (pgvector or a dedicated vector database).
    - Gives at least two concrete trade-offs between the options.
    - Every factual claim is consistent with a pgvector vs dedicated-database comparison (no invented benchmarks or numbers).

- id: plan-sql-analysis
  category: planning
  title: Data question is routed to the analysis specialist
  request: Using the demo sales database, find which customer region has the highest total revenue (quantity times unit price) and write a two-sentence summary for the sales lead.
  expected_subtasks: 2
  checks:
    - {name: status_in, args: {statuses: [completed]}}
    - {name: plan_has_specialists, args: {specialists: [analysis]}}
    - {name: tool_used, args: {tool: sql_query}}
    - {name: deliverable_matches_sql, args: {query: "SELECT c.region FROM demo.orders o JOIN demo.customers c ON c.id=o.customer_id JOIN demo.products p ON p.id=o.product_id GROUP BY 1 ORDER BY sum(o.quantity*p.unit_price) DESC LIMIT 1"}}
  rubric:
    - Names the top region.
    - Is two sentences addressed to a sales lead.

- id: plan-code-task
  category: planning
  title: Calculation is done with code, not guessed
  request: Compute the compound annual growth rate for revenue growing from 1.2 million to 2.0 million over 4 years. Show the calculation and give the result as a percentage with two decimals.
  expected_subtasks: 2
  checks:
    - {name: status_in, args: {statuses: [completed]}}
    - {name: tool_used, args: {tool: run_python}}
    - {name: deliverable_mentions, args: {any_of: ["13.62"]}}
  rubric:
    - Shows the CAGR formula ((end/start)^(1/years) - 1) or an equivalent calculation.
    - States the result as a percentage with two decimals.

- id: plan-three-specialists
  category: planning
  title: Request needing research, data and writing uses all three
  request: Research the indexing options pgvector offers, look up how many orders the demo database contains, and write a short brief that mentions both.
  expected_subtasks: 3
  checks:
    - {name: status_in, args: {statuses: [completed]}}
    - {name: plan_has_specialists, args: {specialists: [research, analysis, writing]}}
    - {name: tool_used, args: {tool: sql_query}}
    - {name: deliverable_matches_sql, args: {query: "SELECT count(*) FROM demo.orders"}}
    - {name: bounded}
  rubric:
    - Mentions at least one pgvector index type (e.g. HNSW or IVFFlat).
    - States the number of orders.
    - Reads as one coherent brief, not two pasted fragments.

- id: plan-no-overplanning
  category: planning
  title: A one-sentence question is not over-planned
  request: What does ANN stand for in vector search? Answer in one sentence.
  expected_subtasks: 1
  checks:
    - {name: status_in, args: {statuses: [completed]}}
    - {name: plan_size, args: {min: 1, max: 2}}
    - {name: deliverable_mentions, args: {any_of: ["approximate nearest neighbo"]}}
    - {name: cost_max, args: {usd: 0.08}}
  rubric:
    - Answers correctly (approximate nearest neighbor).
    - Is a single sentence.

- id: plan-explicit-order
  category: planning
  title: Stated order becomes a dependency
  request: First outline a blog post about pgvector in five bullet points, then write the post from that outline.
  expected_subtasks: 2
  checks:
    - {name: status_in, args: {statuses: [completed]}}
    - {name: plan_has_dependency}
    - {name: plan_size, args: {min: 2, max: 4}}
  rubric:
    - Contains a full blog post (several paragraphs), not just an outline.
    - The post covers the points of a five-point structure in a sensible order.

- id: plan-broad-request
  category: planning
  title: Broad multi-part request gets a valid, bounded plan
  request: Prepare onboarding material for new engineers about vector search with PostgreSQL. Include a glossary of five terms, a one-paragraph architecture overview, and three FAQ entries.
  expected_subtasks: 3
  checks:
    - {name: status_in, args: {statuses: [completed, completed_partial]}}
    - {name: plan_size, args: {min: 2, max: 6}}
    - {name: plan_valid_first_try}
    - {name: bounded}
  rubric:
    - Has a glossary with five terms.
    - Has a one-paragraph architecture overview.
    - Has three FAQ entries with answers.
