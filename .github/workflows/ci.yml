name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

env:
  UV_VERSION: "0.12.9"
  LLM_MODE: fake
  SEARCH_MODE: fixture

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
        with: {version: "${{ env.UV_VERSION }}", enable-cache: true}
      - run: uv sync --frozen
      - run: uv run ruff check .
      - run: uv run ruff format --check .

  mypy:
    needs: lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
        with: {version: "${{ env.UV_VERSION }}", enable-cache: true}
      - run: uv sync --frozen
      - run: uv run mypy

  unit:
    needs: mypy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
        with: {version: "${{ env.UV_VERSION }}", enable-cache: true}
      - run: uv sync --frozen
      - run: uv run pytest -m unit

  integration:
    needs: unit
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:0.8.7-pg17
        env:
          POSTGRES_USER: agentops
          POSTGRES_PASSWORD: agentops  # pragma: allowlist secret
          POSTGRES_DB: agentops
        ports: ["5433:5432"]
        options: >-
          --health-cmd "pg_isready -U agentops -d agentops"
          --health-interval 2s --health-timeout 3s --health-retries 30
    env:
      DATABASE_URL: postgresql+psycopg://agentops:agentops@localhost:5433/agentops  # pragma: allowlist secret
      TEST_DATABASE_URL: postgresql+psycopg://agentops:agentops@localhost:5433/agentops_test  # pragma: allowlist secret
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
        with: {version: "${{ env.UV_VERSION }}", enable-cache: true}
      - run: uv sync --frozen
      - run: make migrate
      - run: uv run pytest -m integration

  images:
    needs: lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - run: docker build -t agentops-app:ci .
      - run: docker build -t agentops-sandbox:ci sandbox
