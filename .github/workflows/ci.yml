name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

env:
  UV_VERSION: "0.12.9"
  LLM_MODE: fake
  SEARCH_MODE: fixture

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
        with: {version: "${{ env.UV_VERSION }}", enable-cache: true}
      - run: uv sync --frozen
      - run: uv run ruff check .
      - run: uv run ruff format --check .

  mypy:
    needs: lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
        with: {version: "${{ env.UV_VERSION }}", enable-cache: true}
      - run: uv sync --frozen
      - run: uv run mypy

  unit:
    needs: mypy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
        with: {version: "${{ env.UV_VERSION }}", enable-cache: true}
      - run: uv sync --frozen
      - run: uv run pytest -m unit

  integration:
    needs: unit
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:0.8.7-pg17
        env:
          POSTGRES_USER: agentops
          POSTGRES_PASSWORD: agentops  # pragma: allowlist secret
          POSTGRES_DB: agentops
        ports: ["5433:5432"]
        options: >-
          --health-cmd "pg_isready -U agentops -d agentops"
          --health-interval 2s --health-timeout 3s --health-retries 30
      mailpit:  # captures mail from the send_email executor test; delivers nothing
        image: axllent/mailpit:v1.33
        ports: ["1025:1025", "8025:8025"]
    env:
      DATABASE_URL: postgresql+psycopg://agentops:agentops@localhost:5433/agentops  # pragma: allowlist secret
      TEST_DATABASE_URL: postgresql+psycopg://agentops:agentops@localhost:5433/agentops_test  # pragma: allowlist secret
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
        with: {version: "${{ env.UV_VERSION }}", enable-cache: true}
      - run: uv sync --frozen
      - run: make migrate
      - run: uv run pytest -m integration

  # Docker-dependent sandbox tests in their own job so the fast jobs stay fast (Phase 3).
  sandbox:
    needs: unit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
        with: {version: "${{ env.UV_VERSION }}", enable-cache: true}
      - run: uv sync --frozen
      - run: docker build -t agentops-sandbox:py312 sandbox
      - run: uv run pytest -m sandbox
        env:
          AGENTOPS_REQUIRE_SANDBOX: "1"  # fail, don't skip, if Docker or the image is missing

  images:
    needs: lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - run: docker build -t agentops-app:ci .
      - run: docker build -t agentops-sandbox:ci sandbox

  ui:
    runs-on: ubuntu-latest
    defaults: {run: {working-directory: ui}}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with: {node-version: "24.19.0", cache: npm, cache-dependency-path: ui/package-lock.json}
      - run: npm ci  # .npmrc: ignore-scripts
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

  e2e:
    # The whole stack in fake mode (no model calls, Mailpit only), driven through the UI.
    needs: [unit, ui]
    runs-on: ubuntu-latest
    env:
      FAKE_LATENCY_MS: "300"  # lets the test watch the DAG change live
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
        with: {version: "${{ env.UV_VERSION }}", enable-cache: true}
      - run: uv sync --frozen
      - uses: actions/setup-node@v7
        with: {node-version: "24.19.0", cache: npm, cache-dependency-path: ui/package-lock.json}
      - run: cp .env.example .env
      - run: make up
      - run: make migrate  # seeds demo-user / demo-reviewer -> .agentops-tokens
      - run: npm ci && npx playwright install --with-deps chromium
        working-directory: ui
      - run: npx playwright test
        working-directory: ui
        env: {CI: "1"}
      - if: failure()
        run: docker compose logs --no-color > compose.log
      - if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: e2e-report
          path: |
            ui/playwright-report
            ui/test-results
            compose.log
          retention-days: 7

  secrets:
    # Full-history secret scan (gitleaks, pinned by digest, no network). Reviewed false
    # positives are listed with reasons in .gitleaksignore.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with: {fetch-depth: 0}
      - run: >-
          docker run --rm --network none -v "$PWD:/repo:ro"
          ghcr.io/gitleaks/gitleaks@sha256:c00b6bd0aeb3071cbcb79009cb16a60dd9e0a7c60e2be9ab65d25e6bc8abbb7f
          git /repo --redact --no-banner --gitleaks-ignore-path /repo/.gitleaksignore

  audit:
    # Known-vulnerability check of locked Python and npm dependencies.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
        with: {version: "${{ env.UV_VERSION }}", enable-cache: true}
      - run: uv export --frozen --no-hashes --no-emit-project --all-groups > requirements.txt
      - run: uvx --from pip-audit==2.10.1 pip-audit -r requirements.txt --disable-pip --no-deps
      - uses: actions/setup-node@v7
        with: {node-version: "24.19.0"}
      - run: npm audit --audit-level=high
        working-directory: ui
