# AgentOps local stack. Developed and tested on native Docker Engine inside WSL2.
# Host ports bind to 127.0.0.1 only and are configurable (5432/8080 are often taken).
name: agentops

x-app: &app
  build: .
  image: agentops-app:dev
  env_file:
    - path: .env
      required: false
  environment: &app-env
    DATABASE_URL: postgresql+psycopg://agentops:agentops@postgres:5432/agentops  # pragma: allowlist secret
    SMTP_HOST: mailpit
    SMTP_PORT: "1025"
    OTEL_EXPORTER_OTLP_ENDPOINT: http://jaeger:4318
    # tracing: `OTEL_ENABLED=true docker compose --profile observability up -d` (ADR-019)
    OTEL_ENABLED: ${OTEL_ENABLED:-false}
    MAILPIT_API_URL: http://mailpit:8025  # lookups from inside the network
    MAILPIT_UI_URL: http://localhost:${MAILPIT_UI_PORT:-8025}  # links for the browser
    UI_ORIGINS: ${UI_ORIGINS:-http://localhost:5173}
    FAKE_LATENCY_MS: ${FAKE_LATENCY_MS:-0}  # fake mode only: pace demo runs (0 = instant)
  networks: [default]

services:
  postgres:
    image: pgvector/pgvector:0.8.7-pg17
    environment:
      POSTGRES_USER: agentops
      POSTGRES_PASSWORD: agentops  # pragma: allowlist secret  (local dev only)
      POSTGRES_DB: agentops
    ports:
      - "127.0.0.1:${PG_PORT:-5433}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U agentops -d agentops"]
      interval: 2s
      timeout: 3s
      retries: 30

  mailpit:
    image: axllent/mailpit:v1.33
    ports:
      - "127.0.0.1:${MAILPIT_UI_PORT:-8025}:8025"
      - "127.0.0.1:${MAILPIT_SMTP_PORT:-1025}:1025"

  migrate:
    <<: *app
    command: ["sh", "-c", "alembic upgrade head && python -m agentops.db.checkpointer"]
    depends_on:
      postgres: {condition: service_healthy}
    restart: "no"

  api:
    <<: *app
    ports:
      - "127.0.0.1:${API_PORT:-8000}:8000"
    depends_on:
      migrate: {condition: service_completed_successfully}
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://localhost:8000/health').status==200 else 1)"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  worker:
    <<: *app
    command: ["python", "-m", "agentops.queue.worker"]
    environment:
      <<: *app-env  # a service's own `environment:` replaces the anchor's; merge it back
      DOCKER_HOST: tcp://docker-socket-proxy:2375
      # Task workspaces (ADR-031): the worker sees them at /workspaces; the sandbox containers
      # it creates through the proxy bind-mount them from the HOST path (the daemon resolves
      # bind sources on the host, not inside this container).
      WORKSPACE_ROOT: /workspaces
      WORKSPACE_HOST_ROOT: ${AGENTOPS_WORKSPACES_HOST_DIR:-${PWD}/var/workspaces}
      MCP_SERVERS: notes,notes_http
      MCP_DATA_DIR: /var/lib/agentops/mcp
    volumes:
      - ${AGENTOPS_WORKSPACES_HOST_DIR:-${PWD}/var/workspaces}:/workspaces
      - mcp-data:/var/lib/agentops/mcp
    depends_on:
      migrate: {condition: service_completed_successfully}
      docker-socket-proxy: {condition: service_started}
      mcp-notes: {condition: service_started}
    networks: [default, docker-proxy]
    restart: unless-stopped

  # Our MCP "notes" server over streamable HTTP (ADR-032). Internal only: no host port.
  # DNS-rebinding protection on; only the Host header the worker uses is accepted.
  mcp-notes:
    <<: *app
    command:
      - python
      - -I
      - -m
      - mcp_servers.notes.server
      - --transport
      - streamable-http
      - --host
      - 0.0.0.0
      - --port
      - "8765"
      - --allowed-host
      - mcp-notes:8765
      - --db
      - /var/lib/agentops/notes/notes.db
    env_file: []
    environment: {}
    volumes:
      - mcp-notes-data:/var/lib/agentops/notes
    restart: unless-stopped

  # The worker reaches Docker only through this proxy (ADR-011): containers API + POST only.
  docker-socket-proxy:
    image: tecnativa/docker-socket-proxy:v0.5.0
    environment:
      CONTAINERS: 1
      POST: 1
      # everything else (images, networks, volumes, exec, build, swarm, ...) stays denied
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    networks: [docker-proxy]
    restart: unless-stopped

  ui:
    build:
      context: ./ui
      args:
        VITE_API_URL: http://localhost:${API_PORT:-8000}
        VITE_JAEGER_URL: ${UI_JAEGER_URL:-}
    image: agentops-ui:dev
    environment:
      API_ORIGIN: http://localhost:${API_PORT:-8000}
    ports:
      - "127.0.0.1:${UI_PORT:-5173}:80"
    depends_on:
      api: {condition: service_healthy}
    restart: unless-stopped

  jaeger:
    image: jaegertracing/jaeger:2.22.0
    profiles: [observability]
    ports:
      - "127.0.0.1:${JAEGER_UI_PORT:-16686}:16686"

  sandbox:
    build: ./sandbox
    image: agentops-sandbox:py312
    profiles: [build-only]
    network_mode: none

networks:
  default: {}
  docker-proxy:
    internal: true

volumes:
  pgdata:
  mcp-data:
  mcp-notes-data: {}
